<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Sunny Toronto waterfront</title>
  <desc id="description">A simple illustration of the Toronto skyline, streetcar, park, and waterfront on a clear day.</desc>
  <defs>
