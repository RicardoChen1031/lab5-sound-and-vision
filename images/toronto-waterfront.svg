      <stop offset="0" stop-color="#75c9ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f86bd"/>
      <stop offset="1" stop-color="#064c78"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
